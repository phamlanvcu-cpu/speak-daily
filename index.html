<style>
/* Layout: one-screen phone app — slim header, scrolling main, bottom tab bar. Highlighter-pen marks the target expression everywhere; level = 7 rungs of a ladder. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#132029; --muted:#5A6A74; --line:#D3DCE1;
  --accent:#0B6E8A; --accent-ink:#FFFFFF; --accent-soft:#D9EBF1;
  --mark:#FFE27A; --mark-ink:#132029;
  --good:#1D8657; --good-soft:#DDF1E6; --bad:#BF4038; --bad-soft:#F8E1DE;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E161B; --surface:#16222A; --ink:#E4EDF1; --muted:#93A5AF; --line:#27363F;
    --accent:#4FB3D1; --accent-ink:#06222C; --accent-soft:#163541;
    --mark:#7A6514; --mark-ink:#FFF6CF;
    --good:#4CC38A; --good-soft:#123326; --bad:#F07B72; --bad-soft:#3A1A18;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E161B; --surface:#16222A; --ink:#E4EDF1; --muted:#93A5AF; --line:#27363F;
  --accent:#4FB3D1; --accent-ink:#06222C; --accent-soft:#163541;
  --mark:#7A6514; --mark-ink:#FFF6CF;
  --good:#4CC38A; --good-soft:#123326; --bad:#F07B72; --bad-soft:#3A1A18;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:10px;background:var(--mark);border-radius:3px;transform:skewX(-12deg)}
.sync{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.big{width:56px;height:56px}
.icon-btn.big svg{width:26px;height:26px}
.icon-btn.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.icon-btn.rec{animation:none}}
mark{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 88%,transparent 88%);color:var(--mark-ink);padding:0 .15em;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.k{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rungs{display:inline-flex;gap:2px;vertical-align:middle}
.rungs b{width:6px;height:12px;border-radius:2px;background:var(--line)}
.rungs b.on{background:var(--accent)}
.stat{display:flex;flex-direction:column}
.stat strong{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.heat i.l2{background:var(--accent)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .en{font-weight:500}
.li .vi{font-size:13px;color:var(--muted)}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topic > button{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.topic .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.badge-cur{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:999px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
/* session */
.sess-top{display:flex;align-items:center;gap:12px}
.sess-top .bar{flex:1;height:8px}
.prompt{font-size:20px;line-height:1.45;font-weight:500}
.target{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.1}
.vi-line{color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:16px;min-height:50px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);height:1.1em;vertical-align:-2px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px}
.tile.used{visibility:hidden}
.answer-zone{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .head{font-weight:600}
.fb.ok .head{color:var(--good)}
.fb.no .head{color:var(--bad)}
.diff span{padding:0 2px;border-radius:3px}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline}
.ctx{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ctx:first-child{border-top:0}
.ctx .grow{flex:1;display:flex;flex-direction:column;gap:2px}
.heard{min-height:24px;font-style:italic;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.aibox{white-space:pre-wrap;font-size:15px;line-height:1.6}
.hero-day{display:flex;flex-direction:column;gap:4px}
.spacer{flex:1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
</style>

</head><body>

</div>

<script>

const TOPICS=[

const RAW={
greet:[
["w","introduce","giới thiệu",[["Let me {introduce} myself. My name is Anna.","Để tôi giới thiệu bản thân. Tôi tên là Anna.","Công việc"],["Can you {introduce} me to your manager?","Bạn có thể giới thiệu tôi với quản lý của bạn không?","Công việc"],["My son wants to {introduce} his new friend to us.","Con trai tôi muốn giới thiệu bạn mới với chúng tôi.","Gia đình"]]],
["w","nice to meet you","rất vui được gặp bạn",[["Hi, I'm Anna. {Nice to meet you}.","Chào, tôi là Anna. Rất vui được gặp bạn.","Bạn bè"],["{Nice to meet you}, Mr. Kim. Welcome to our office.","Rất vui được gặp anh, anh Kim. Chào mừng đến văn phòng chúng tôi.","Công việc"],["It was {nice to meet you} at the trade fair.","Rất vui được gặp anh ở hội chợ.","Công việc"]]],
["w","come from","đến từ",[["Where do you {come from}?","Bạn đến từ đâu?","Bạn bè"],["I {come from} Hai Phong, a big port city in Vietnam.","Tôi đến từ Hải Phòng, một thành phố cảng lớn ở Việt Nam.","Du lịch"],["These containers {come from} Busan.","Những container này đến từ Busan.","Logistics"]]],
["w","colleague","đồng nghiệp",[["This is my {colleague}, Linh. She works in customer service.","Đây là đồng nghiệp của tôi, Linh. Cô ấy làm chăm sóc khách hàng.","Công việc"],["I have lunch with my {colleagues} every day.","Tôi ăn trưa với các đồng nghiệp mỗi ngày.","Công việc"],["My {colleague} will call you back this afternoon.","Đồng nghiệp của tôi sẽ gọi lại cho bạn chiều nay.","Công việc"]]],

["p","What do you do...?","Bạn làm (nghề) gì...?",[["{What do you do}? I'm a sales manager.","Bạn làm nghề gì? Tôi là quản lý kinh doanh.","Công việc"],["{What do you do} in your free time?","Bạn làm gì lúc rảnh?","Bạn bè"],["{What do you do} when a customer is angry?","Bạn làm gì khi khách hàng tức giận?","Công việc"]]],

["w","look after","chăm sóc, trông",[["My mother {looks after} my daughter when I'm at work.","Mẹ tôi trông con gái tôi khi tôi đi làm.","Gia đình"],["Can you {look after} my cat this weekend?","Bạn trông con mèo giúp tôi cuối tuần này được không?","Bạn bè"],["Our team {looks after} customers in Korea.","Đội chúng tôi chăm sóc khách hàng ở Hàn Quốc.","Công việc"]]],
["w","grow up","lớn lên",[["I {grew up} in a small town near the sea.","Tôi lớn lên ở một thị trấn nhỏ gần biển.","Gia đình"],["Children {grow up} so fast!","Trẻ con lớn nhanh quá!","Gia đình"],["What do you want to be when you {grow up}?","Con muốn làm gì khi lớn lên?","Trường học"]]],

["p","There are...","Có (bao nhiêu)...",[["{There are} four people in my family.","Gia đình tôi có bốn người.","Gia đình"],["{There are} twenty people in our sales team.","Đội kinh doanh của chúng tôi có hai mươi người.","Công việc"],["{There are} three containers waiting at the port.","Có ba container đang chờ ở cảng.","Logistics"]]],
["p","I used to...","Tôi đã từng (thường)...",[["{I used to} play football with my brother.","Tôi từng chơi bóng đá với anh trai.","Gia đình"],["{I used to} live near the river.","Tôi từng sống gần sông.","Nhà cửa"],["{I used to} work at a shipping company.","Tôi từng làm ở một công ty vận tải biển.","Công việc"]]]],

let DICT=null,SAMPLE=null,SAMPLE_IMG=false,TTSCAP=null,SR_BLOCKED=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
async function initCaps(){
  const c=window.claude; if(!c||!c.use) return;
  c.use("dictation").then(d=>{DICT=d; if(view==="session") renderSession()}).catch(()=>{});
  c.use("tts").then(t=>{TTSCAP=t}).catch(()=>{});
  c.use("sample").then(async s=>{SAMPLE=s; if(s){try{const l=await s.limits();SAMPLE_IMG=!!(l&&l.images)}catch(e){}} if(view!=="session") render()}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    REF=db.doc("data/users/"+id+"/state");
    const snap=await REF.get();
    if(snap.exists){
      const r=snap.data()||{};
      if(r.json && (r.upd||0)>(S.upd||0)){
        S=Object.assign(blank(),JSON.parse(r.json));applyExtra();
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        if(view!=="session") render();
        setSync("Đã đồng bộ");
      } else if((S.upd||0)>(r.upd||0)) doWrite(); else setSync("Đã đồng bộ");
    } else if(S.upd) doWrite(); else setSync("Đã đồng bộ");
  }catch(e){setSync("Lưu trên máy này")}
}

const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hl(s){return esc(s).replace(/\{([^}]*)\}/,"<mark>$1</mark>").replace(/[{}]/g,"")}
function plain(s){return String(s).replace(/[{}]/g,"")}
function tgt(s){const m=String(s).match(/\{([^}]*)\}/);return m?m[1]:""}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function allItems(){return BUILT.concat(Object.values(S.custom))}
function itemById(id){return S.custom[id]||BUILT.find(b=>b.id===id)}
function topicName(k){const t=TOPICS.find(t=>t.k===k);return t?t.n:""}
function rungs(l){let h='<span class="rungs" aria-label="Mức '+(l||0)+'/7">';for(let i=1;i<=MAXL;i++)h+='<b class="'+(i<=(l||0)?"on":"")+'"></b>';return h+"</span>"}
const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","what's":"what is","there's":"there is","he's":"he is","she's":"she is","don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","i'll":"i will","you'll":"you will","we'll":"we will","i'd":"i would","you'd":"you would","let's":"let us","i've":"i have","we've":"we have","haven't":"have not","wasn't":"was not","weren't":"were not","shouldn't":"should not","couldn't":"could not"};
function norm(s){return plain(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\s-]/g," ").split(/\s+/).filter(Boolean).map(w=>CONTR[w]||w).join(" ").replace(/'/g,"").replace(/-/g," ").split(/\s+/).filter(Boolean)}
function lcs(a,b){const m=Array(b.length+1).fill(0);for(let i=1;i<=a.length;i++){let prev=0;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=a[i-1]===b[j-1]?prev+1:Math.max(m[j],m[j-1]);prev=t}}return m[b.length]}
function score(ans,ref){const a=norm(ans),b=norm(ref);if(!b.length)return 0;return lcs(a,b)/Math.max(a.length,b.length)}
function diffHtml(ans,ref){const a=new Set(norm(ans));return plain(ref).split(/\s+/).map(w=>{const n=norm(w)[0];return (n&&!a.has(n))?'<span class="miss">'+esc(w)+"</span>":"<span>"+esc(w)+"</span>"}).join(" ")}

/* speech out */
let VOICE=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|google|samantha|aria|jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,slow){
  text=plain(text);
  if("speechSynthesis" in window && (VOICE||speechSynthesis.getVoices().length||!TTSCAP)){
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(VOICE)u.voice=VOICE;u.rate=slow?0.6:S.set.rate;speechSynthesis.speak(u);return}
  if(TTSCAP){TTSCAP.speak(text,{language:"en",rate:slow?0.7:Math.max(0.7,S.set.rate)}).catch(()=>{})}
}
/* speech in */
function micOK(){return !!DICT||(!!SR&&!SR_BLOCKED)}
let stopMic=null;
function listen(onText,onDone){
  if(DICT){
    let fin="";const u=[];
    const end=r=>{u.forEach(f=>f());stopMic=null;onDone(fin,r)};
    u.push(DICT.onPartial(e=>onText((fin+" "+e.text).trim())));
    u.push(DICT.onFinal(e=>{fin=(fin+" "+e.text).trim();onText(fin)}));
    u.push(DICT.onState(e=>{if(e.state==="idle")end(e.reason)}));
    DICT.start({language:"en-US"}).catch(err=>end(err&&err.code));
    stopMic=()=>DICT.stop().catch(()=>{});return;
  }
  if(SR&&!SR_BLOCKED){
    const r=new SR();r.lang="en-US";r.interimResults=true;r.continuous=false;let txt="",err=null;
    r.onresult=e=>{txt=[...e.results].map(x=>x[0].transcript).join(" ");onText(txt)};
    r.onerror=e=>{err=e.error;if(e.error==="not-allowed"||e.error==="service-not-allowed")SR_BLOCKED=true};
    r.onend=()=>{stopMic=null;onDone(txt,err)};
    try{r.start();stopMic=()=>r.stop()}catch(e){onDone("","unavailable")}
  }
}

function newCandidates(){
  const cu=S.units.find(u=>u.id===S.cur);
  const order=[];
  if(cu) order.push(...cu.items.map(id=>S.custom[id]));
  const rel=S.focus||(cu&&cu.topic);
  if(rel) order.push(...BUILT.filter(b=>b.t===rel));
  S.units.forEach(u=>{if(u!==cu) order.push(...u.items.map(id=>S.custom[id]))});
  order.push(...BUILT);
  const seen=new Set();return order.filter(it=>it&&!S.p[it.id]&&!seen.has(it.id)&&seen.add(it.id));
}
function doneToday(){return S.hist[today()]}

async function moreContexts(id,btn){
  const it=itemById(id);if(!SAMPLE||!it)return;btn.disabled=true;btn.textContent="Đang tạo…";

Return JSON: {"ctx":[["sentence with {target}","natural Vietnamese translation","context tag in Vietnamese, 1-2 words, e.g. Gia đình, Công việc, Logistics, Du lịch, Bạn bè, Mua sắm, Sức khoẻ, Học tập, Hằng ngày"]]}`,{modelTier:"quick"});

}
function cleanCtx(arr,en){
  if(!Array.isArray(arr))return[];
  return arr.filter(c=>Array.isArray(c)&&typeof c[0]==="string").map(c=>{
    let s=c[0].slice(0,220);
    if(!/\{[^}]+\}/.test(s)){const i=s.toLowerCase().indexOf(String(en).toLowerCase().replace(/\.\.\.|…/g,"").trim());const L=String(en).replace(/\.\.\.|…/g,"").trim().length;if(i<0||!L)return null;s=s.slice(0,i)+"{"+s.slice(i,i+L)+"}"+s.slice(i+L)}
    s=s.replace(/\}([^{]*)\{/g,"$1");
    return [s,String(c[1]||"").slice(0,220),String(c[2]||"Mở rộng").slice(0,24)]}).filter(Boolean);
}

/* ============ SESSION ENGINE ============ */
let SS=null;
function task(id,kind,stage){return {id,kind,stage}}
function startSession(mode){
  const t=today();let reviews=[],fresh=[];
  if(mode==="weak"){reviews=Object.entries(S.p).filter(([id,p])=>p.w>0&&itemById(id)).sort((a,b)=>b[1].w/(b[1].n+1)-a[1].w/(a[1].n+1)).slice(0,8).map(([id])=>itemById(id))}
  else{reviews=dueItems().slice(0,S.set.maxReview);fresh=newCandidates().slice(0,mode==="extra"?3:S.set.newPerDay)}
  reviews=shuffle(reviews);
  const q=[];const rv=reviews.slice();
  fresh.forEach(it=>{q.push(task(it.id,"learn",0));q.push(...rv.splice(0,2).map(r=>task(r.id,"ex",S.p[r.id].l)))});
  fresh.forEach(it=>{const at=q.findIndex(x=>x.id===it.id&&x.kind==="learn");q.splice(Math.min(q.length,at+3),0,task(it.id,"ex",0))});
  rv.forEach(r=>q.push(task(r.id,"ex",S.p[r.id].l)));
  fresh.forEach((it,i)=>q.splice(Math.min(q.length,q.length-Math.floor(i*1.5)),0,task(it.id,"ex",1)));
  if(!q.length){toast("Chưa có gì để luyện");return}
  const left={};q.forEach(x=>left[x.id]=(left[x.id]||0)+1);
  SS={mode,q,i:0,left,wrong:{},ci:{},isNew:Object.fromEntries(fresh.map(f=>[f.id,true])),ok:0,tot:0,lastType:null,ui:null,done:[],learnedIds:fresh.map(f=>f.id)};
  view="session";render();
}
const POOL=[["meaning","cloze_mcq"],["cloze_mcq","pick_en","order"],["order","cloze_type","speak"],["cloze_type","dictation","speak"],["translate","dictation","speak"]];
function pickType(it,stage){
  const real=it.ctx.some(c=>plain(c[0]).split(/\s+/).length>2);
  let pool=real?POOL[Math.min(stage,4)]:["meaning","pick_en","speak"];
  const f=pool.filter(p=>p!==SS.lastType);if(f.length)pool=f;
  return pool[Math.floor(Math.random()*pool.length)]||pool[0];
}
function nextCtx(it){
  const real=it.ctx.map((c,i)=>i).filter(i=>plain(it.ctx[i][0]).split(/\s+/).length>2);
  const list=real.length?real:it.ctx.map((c,i)=>i);
  if(SS.ci[it.id]==null)SS.ci[it.id]=Math.floor(Math.random()*list.length);else SS.ci[it.id]++;
  return it.ctx[list[SS.ci[it.id]%list.length]];
}
function distract(n,fn,exclude){
  const seen=new Set([String(exclude).toLowerCase()]);const out=[];
  for(const it of shuffle(allItems())){const v=fn(it);if(!v)continue;const k=String(v).toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(v);if(out.length>=n)break}
  return out;
}
function renderSession(){
  if(!SS)return go("home");
  if(SS.i>=SS.q.length)return finishSession();
  const tk=SS.q[SS.i],it=itemById(tk.id);
  if(!it){SS.i++;return renderSession()}
  if(!SS.ui||SS.ui.idx!==SS.i){
    const type=tk.kind==="learn"?"learn":pickType(it,tk.stage);
    SS.ui={idx:SS.i,type,ctx:tk.kind==="learn"?null:nextCtx(it),answered:false,picked:[],heard:""};
    if(type!=="learn")SS.lastType=type;
    prepare(SS.ui,it);
  }
  const u=SS.ui,pct=Math.round(SS.i/SS.q.length*100);
  $("#main").innerHTML=`<div class="sess-top"><button class="icon-btn" id="quit" aria-label="Dừng buổi học">${IC.x}</button><div class="bar"><i style="width:${pct}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${SS.i+1}/${SS.q.length}</span></div>
  <div id="ex" class="stack" style="gap:16px">${exHtml(u,it)}</div><div id="fb"></div>`;
  $("#quit").onclick=()=>{if(stopMic)stopMic();SS=null;go("home")};
  bindEx(u,it);
  if(u.answered)showFb(u,it,true);
}
function prepare(u,it){
  const c=u.ctx;
  if(u.type==="meaning"){u.opts=shuffle([it.vi,...distract(3,x=>x.vi,it.vi)]);u.ans=it.vi}
  if(u.type==="pick_en"){u.opts=shuffle([it.en,...distract(3,x=>x.k===it.k?x.en:null,it.en)]);u.ans=it.en}
  if(u.type==="cloze_mcq"){const t=tgt(c[0]);u.ans=t;u.opts=shuffle([t,...distract(3,x=>{const cc=x.ctx[Math.floor(Math.random()*x.ctx.length)];const v=tgt(cc[0]);return x.k===it.k&&v.split(" ").length<=t.split(" ").length+2?v:null},t)])}
  if(u.type==="order"){let w=plain(c[0]).split(/\s+/);while(w.length>8){let bi=0,bl=1e9;for(let k=0;k<w.length-1;k++){const L=w[k].length+w[k+1].length;if(L<bl){bl=L;bi=k}}w.splice(bi,2,w[bi]+" "+w[bi+1])}u.tiles=w;u.order=shuffle(w.map((x,i)=>i));if(u.order.every((x,i)=>x===i)&&w.length>1)u.order.reverse()}

function bindEx(u,it){
  const ex=$("#ex");
  ex.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  ex.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>speak(u.ctx[0],b.dataset.sp==="1"));
  if(u.type==="learn"){
    if(!u.spoken){u.spoken=true;setTimeout(()=>speak(it.en),250)}
    ex.querySelectorAll("[data-ctx]").forEach(b=>b.onclick=()=>speak(it.ctx[+b.dataset.ctx][0]));
    $("#playall").onclick=()=>playAll(it.ctx.map(c=>plain(c[0])));
    $("#next").onclick=()=>{SS.left[it.id]--;advance()};return;
  }
  if(["dictation","speak"].includes(u.type)&&!u.spoken){u.spoken=true;setTimeout(()=>speak(u.ctx[0]),250)}
  if(u.type==="meaning"&&!u.spoken){u.spoken=true;setTimeout(()=>speak(it.en),250)}
  ex.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(u.answered)return;const v=u.opts[+b.dataset.o];u.given=v;grade(u,it,v===u.ans);
    ex.querySelectorAll("[data-o]").forEach(x=>{const ov=u.opts[+x.dataset.o];if(ov===u.ans)x.classList.add("right");else if(x===b)x.classList.add("wrong");x.disabled=true})});
  ex.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{if(u.answered)return;u.picked.push(+b.dataset.ti);rerenderEx(u,it)});
  ex.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{if(u.answered)return;u.picked.splice(+b.dataset.un,1);rerenderEx(u,it)});
  const inp=$("#inp");
  if(inp){if(u.answered)inp.value=u.given||"";else{if(u.draft)inp.value=u.draft;inp.oninput=()=>u.draft=inp.value;if(u.type==="cloze_type")inp.onkeydown=e=>{if(e.key==="Enter")$("#check").click()};if(u.type!=="translate")setTimeout(()=>inp.focus(),50)}}
  const ck=$("#check");
  if(ck)ck.onclick=()=>{
    if(u.type==="order"){const s=u.picked.map(i=>u.tiles[i]).join(" ");u.given=s;grade(u,it,norm(s).join(" ")===norm(u.ctx[0]).join(" "));return}
    const v=(inp.value||"").trim();if(!v){inp.focus();return}u.given=v;
    if(u.type==="cloze_type"){grade(u,it,norm(v).join(" ")===norm(u.ans).join(" "));return}
    const sc=score(v,u.ans);u.sc=sc;grade(u,it,sc>=(u.type==="translate"?0.8:0.85));
  };
  const mic=$("#mic");
  if(mic)mic.onclick=()=>{
    if(stopMic){stopMic();return}
    mic.classList.add("rec");$("#heard").textContent="Đang nghe…";
    listen(t=>{$("#heard").textContent=t||"Đang nghe…";if(u.type==="translate"&&inp){inp.value=t;u.draft=t}},(t,reason)=>{
      mic.classList.remove("rec");
      if(!t){$("#heard").textContent=reason==="not_granted"||SR_BLOCKED?"Micro chưa được phép. Bạn có thể gõ hoặc tự chấm.":"Chưa nghe rõ, bấm micro để thử lại.";if(SR_BLOCKED&&!DICT)rerenderEx(u,it);return}
      if(u.type==="speak"){u.given=t;u.sc=score(t,u.ans);grade(u,it,u.sc>=0.7)}
    });
  };
  $("#selfok")&&($("#selfok").onclick=()=>grade(u,it,true,true));
  $("#selfno")&&($("#selfno").onclick=()=>grade(u,it,false,true));
}

function grade(u,it,ok,self){

function advance(){
  const tk=SS.q[SS.i];
  if(tk&&SS.left[tk.id]<=0&&!SS.done.includes(tk.id))finalize(tk.id);
  SS.i++;SS.ui=null;renderSession();$("#main").scrollTop=0;
}
function finalize(id){
  SS.done.push(id);const t=today();
  const p=S.p[id]||{l:0,due:t,n:0,w:0};const wrong=!!SS.wrong[id];
  if(SS.mode==="weak"){ if(wrong){p.due=t+1;p.w++} else {p.n++; p.w=Math.max(0,p.w-1)} }
  else if(!S.p[id]||p.l===0){p.l=1;p.due=t+1;if(wrong)p.w++;else p.n++}
  else if(!wrong){p.l=Math.min(MAXL,p.l+1);p.due=t+IV[p.l];p.n++}
  else{p.l=Math.max(1,p.l-1);p.due=t+1;p.w++}
  S.p[id]=p;save();
}
let lastAdjust="";
function finishSession(){
  SS.q.forEach(x=>{if(!SS.done.includes(x.id)&&SS.left[x.id]<=0)finalize(x.id)});
  const t=today(),acc=SS.tot?SS.ok/SS.tot:1;
  if(S.streak.last!==t){S.streak.n=(S.streak.last===t-1)?S.streak.n+1:1;S.streak.last=t}
  const prev=S.hist[t];S.hist[t]={n:(prev?prev.n:0)+SS.tot,acc:prev?(prev.acc*prev.n+acc*SS.tot)/Math.max(1,prev.n+SS.tot):acc};
  lastAdjust="";
  if(S.set.auto&&SS.mode==="daily"&&SS.tot>=6){
    if(acc>=0.9&&S.set.newPerDay<10){S.set.newPerDay++;lastAdjust="Bạn làm đúng "+Math.round(acc*100)+"%. Từ mai app tăng lên "+S.set.newPerDay+" mục mới mỗi ngày."}
    else if(acc<0.7&&S.set.newPerDay>3){S.set.newPerDay--;lastAdjust="Hôm nay đúng "+Math.round(acc*100)+"%. Từ mai app giảm còn "+S.set.newPerDay+" mục mới để ôn kỹ hơn."}
  }
  save();SS.final={acc,tot:SS.tot,learned:SS.learnedIds.slice(),reviewed:SS.done.length};view="done";render();
}

  <div class="card"><h3>Làm lại từ đầu</h3><p class="small muted">Xoá toàn bộ tiến độ (giữ các bài đã thêm).</p><button class="btn sm" id="reset">Xoá tiến độ</button></div>
  <p class="small muted">Cài lên điện thoại: mở trang này trong Chrome (Android) hoặc Safari (iPhone), chọn menu, rồi chọn “Thêm vào màn hình chính”.</p>`;
  $("#npd").oninput=e=>{S.set.newPerDay=+e.target.value;$("#npdv").textContent=S.set.newPerDay};$("#npd").onchange=save;
  $("#auto").onchange=e=>{S.set.auto=e.target.checked;save()};
  $("#rate").oninput=e=>{S.set.rate=+e.target.value;$("#ratev").textContent=S.set.rate.toFixed(2)+"×"};$("#rate").onchange=save;
  $("#test").onclick=()=>speak("Could you please send me the quotation by Friday?");
  $("#exp").onclick=()=>{const b=$("#bk");b.hidden=false;b.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));b.select();toast("Đã tạo mã. Sao chép và lưu lại.")};
  $("#imp").onclick=()=>{const b=$("#bk");b.hidden=false;b.value="";b.placeholder="Dán mã sao lưu vào đây";$("#impgo").hidden=false;b.focus()};
  $("#impgo").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o||!o.p)throw 0;S=Object.assign(blank(),o);applyExtra();save();toast("Đã khôi phục");renderSettings()}catch(e){toast("Mã không hợp lệ")}};
  let armed=false;$("#reset").onclick=()=>{if(!armed){armed=true;$("#reset").textContent="Bấm lần nữa để xác nhận";return}S.p={};S.hist={};S.streak={last:-1,n:0};save();toast("Đã xoá tiến độ");renderSettings()};
}

applyExtra();
render();
initCaps();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=202611261740').catch(()=>{});
</script>
